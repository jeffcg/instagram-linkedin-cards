<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card 1 - Gancho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .card {
            width: 1080px;
            height: 1350px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 69, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .card::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        .emoji {
            font-size: 80px;
            margin-bottom: 30px;
            display: block;
        }
        
        h1 {
            font-size: 58px;
            color: #fff;
            font-weight: 700;
            margin-bottom: 40px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .highlight {
            color: #ff4500;
        }
        
        .subtitle {
            font-size: 32px;
            color: #00c8ff;
            font-weight: 600;
            margin-bottom: 60px;
            line-height: 1.3;
        }
        
        .cta-text {
            font-size: 28px;
            color: #fff;
            margin-top: 40px;
        }
        
        .arrow {
            font-size: 48px;
            display: block;
            margin-top: 30px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(20px);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <span class="emoji">🔥</span>
            <h1><span class="highlight">FALHA</span><br>MUSCULAR:</h1>
            <div class="subtitle">O que a ciência<br>realmente diz?</div>
            <p class="cta-text">Nem tudo que parece eficaz<br>é necessário.</p>
            <p class="cta-text">Vem desvendar esse mito!</p>
            <span class="arrow">👇</span>
        </div>
    </div>
</body>
</html>
